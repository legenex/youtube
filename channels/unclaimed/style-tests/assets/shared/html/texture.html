<!doctype html>
<meta charset="utf-8">
<title>texture</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; }
  .sheet { position: absolute; inset: 0; }

  /* paper */
  body.paper .sheet {
    background:
      radial-gradient(120% 90% at 30% 12%, rgba(255,255,255,.55), rgba(0,0,0,0) 60%),
      radial-gradient(90% 80% at 82% 88%, rgba(120,104,74,.20), rgba(0,0,0,0) 62%),
      linear-gradient(158deg, #efe9da 0%, #e6dfcd 44%, #ded5c0 100%);
  }
  /* manila */
  body.manila .sheet {
    background:
      radial-gradient(110% 85% at 22% 8%, rgba(255,240,205,.42), rgba(0,0,0,0) 58%),
      radial-gradient(95% 85% at 88% 92%, rgba(86,64,26,.30), rgba(0,0,0,0) 60%),
      linear-gradient(162deg, #d9b878 0%, #cfa863 46%, #bd9550 100%);
  }
  .grain { position: absolute; inset: -10%; opacity: .40; mix-blend-mode: multiply; }
  body.manila .grain { opacity: .34; }
  .fibre { position: absolute; inset: 0; opacity: .16; mix-blend-mode: overlay; }
  .vig { position: absolute; inset: 0; background: radial-gradient(115% 105% at 50% 46%, rgba(0,0,0,0) 52%, rgba(28,20,8,.42) 100%); }
  .crease { position: absolute; inset: 0; opacity: .5;
    background:
      linear-gradient(92deg, rgba(0,0,0,0) 39.4%, rgba(0,0,0,.10) 39.9%, rgba(255,255,255,.16) 40.4%, rgba(0,0,0,0) 41%),
      linear-gradient(3deg, rgba(0,0,0,0) 71.4%, rgba(0,0,0,.09) 71.9%, rgba(255,255,255,.13) 72.4%, rgba(0,0,0,0) 73%);
  }
  /* manila folder edge */
  .tab { display: none; }
  body.manila .tab { display: block; position: absolute; left: 0; right: 0; top: 0; height: 62px;
    background: linear-gradient(180deg, rgba(255,244,214,.30), rgba(0,0,0,.05));
    border-bottom: 2px solid rgba(96,70,26,.35); }
  body.manila .tab::after { content: ''; position: absolute; left: 58%; top: 0; width: 300px; height: 62px;
    background: linear-gradient(180deg, #e2c489, #cfa863); border-right: 2px solid rgba(96,70,26,.35);
    border-bottom: 2px solid rgba(96,70,26,.22); border-radius: 0 10px 0 0; }
</style>
<body>
<div class="sheet"></div>
<svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
<svg class="fibre" xmlns="http://www.w3.org/2000/svg"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.42" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#f)"/></svg>
<div class="crease"></div>
<div class="tab"></div>
<div class="vig"></div>
<script>
  document.body.className = (new URLSearchParams(location.search)).get('k') || 'paper';
</script>
