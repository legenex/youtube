<!doctype html>
<meta charset="utf-8">
<title>style 8 vector data graphics</title>
<!--
  Editorial vector data graphics on paper white. Every composition is rendered
  in its finished state; the bar is revealed in ffmpeg with a wipe and the
  figures resolve from redaction, so no intermediate number is ever printed.
  The bar carries no scale ticks, because any tick value would be a figure the
  narration never states.

  Layouts are laid out on an explicit grid and never overlap the space the build
  reserves for an overlay figure: the bar column stops at x=280, the figure sits
  from x=320.
-->
<style>
  @font-face { font-family: fpublic;  src: url('../../../../work-ep02/fonts/publicsans.ttf'); }
  @font-face { font-family: fpublicb; src: url('../../../../work-ep02/fonts/publicsans-bold.ttf'); }
  @font-face { font-family: fmono;    src: url('../../../../work-ep02/fonts/plexmono.ttf'); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #F7F5F0;
         font-family: fpublic, sans-serif; color: #14161A; }
  /* On a paper white ground the ink covers so little of the frame that a cut
     between two similar layouts scores below the 0.1 scene threshold. Each shot
     therefore reframes the page as well as changing its content. */
  #stage { position: absolute; inset: 0; transform-origin: 0 0; }

  .kicker { font-family: fmono; font-size: 13px; letter-spacing: .20em;
            text-transform: uppercase; color: #6B6F76; position: absolute; }
  .rule { background: #14161A; position: absolute; }
  .hair { background: #C9C6BE; position: absolute; }
  .note { font-size: 15px; color: #4A4E55; line-height: 1.5; position: absolute; }
  .bar  { background: #14161A; position: absolute; }
  .dot  { border-radius: 50%; }
</style>
<body>
<div id="stage"></div>
<script>
  var p = new URLSearchParams(location.search);
  var g = function (k, d) { var v = p.get(k); return v === null ? d : v; };
  var st = document.getElementById('stage');

  function add(cls, css, html) {
    var e = document.createElement('div');
    e.className = cls || '';
    e.style.cssText = css;
    if (html !== undefined) e.innerHTML = html;
    st.appendChild(e);
    return e;
  }

  function head(text) {
    add('kicker', 'left:110px;top:82px', text);
    add('rule', 'left:110px;top:110px;width:1060px;height:1px');
  }

  function foot(text) {
    add('hair', 'left:110px;top:626px;width:1060px;height:1px');
    add('kicker', 'left:110px;top:646px', text);
  }

  var scene = g('scene', 'bar');

  if (scene === 'bar' || scene === 'barclose') {
    head('Held by the states');
    var close = scene === 'barclose';
    var bw = close ? 250 : 150;
    var bh = parseFloat(g('h', close ? 430 : 372));
    var base = 596;                         // baseline every bar sits on
    add('bar', 'left:110px;width:' + bw + 'px;top:' + (base - bh) + 'px;height:' + bh + 'px');
    add('hair', 'left:110px;top:' + base + 'px;width:1060px;height:1px');
    // the figure overlay lands beside the bar; nothing is drawn into that column
    add('note', 'left:' + (close ? 430 : 320) + 'px;top:' + (close ? 404 : 372) + 'px;width:430px',
        'Reported to state administrators by banks, insurers and employers after a '
        + 'dormancy period, and held in the owner&rsquo;s name.');
    foot('Waiting to be claimed');
  }

  // gridsolid inverts the field to ink so the closing cut carries real luma
  // weight: light grey dots on cream differ too little for a cut to register.
  if (scene === 'grid' || scene === 'gridmark' || scene === 'gridsolid') {
    head('Americans with property on file');
    var mark = scene !== 'grid';
    var solid = scene === 'gridsolid';
    var cols = 7, rows = 7, d = 46, gap = 20;
    var gx = 110, gy = 168;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        // one marked dot per row of seven, so the ratio is countable on screen
        var on = c === 3;
        var col = on ? (mark ? '#3AAE5C' : '#14161A')
                     : (solid ? '#14161A' : '#D5D2CA');
        add('dot', 'position:absolute;left:' + (gx + c * (d + gap)) + 'px;top:'
            + (gy + r * (d + gap)) + 'px;width:' + d + 'px;height:' + d + 'px;background:' + col);
      }
    }
    // a close-up crops the caption in half, so the wide shots carry it instead
    if (g('nonote', '0') !== '1') {
      add('note', 'left:' + (gx + cols * (d + gap) + 74) + 'px;top:430px;width:340px',
          'Every marked dot is one person with property reported in their name.');
    }
    foot('Free to search, free to claim');
  }

  if (scene === 'statement') {
    add('rule', 'left:110px;top:250px;width:1060px;height:6px');
    add('kicker', 'left:110px;top:82px', g('k', ''));
    add('hair', 'left:110px;top:110px;width:1060px;height:1px');
    foot(g('f', 'Unclaimed property'));
  }

  // sign-off layout: the rule moves under the type and the measure narrows, so
  // the ink sits somewhere else in the frame than on the statement page
  if (scene === 'signoff') {
    add('kicker', 'left:110px;top:82px', g('k', ''));
    add('hair', 'left:110px;top:110px;width:1060px;height:1px');
    add('rule', 'left:110px;top:432px;width:700px;height:10px');
    add('note', 'left:110px;top:470px;width:560px',
        'Searching a state register is free, and property stays on file in the '
        + 'owner&rsquo;s name until it is claimed.');
    foot(g('f', 'Free to search, free to claim'));
  }

  var zoom = parseFloat(g('zoom', '1'));
  var sx = parseFloat(g('sx', '0')), sy = parseFloat(g('sy', '0'));
  if (zoom !== 1 || sx || sy) {
    st.style.transform = 'translate(' + (-sx * zoom) + 'px,' + (-sy * zoom)
                       + 'px) scale(' + zoom + ')';
  }
</script>
