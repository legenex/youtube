<!doctype html>
<meta charset="utf-8">
<title>style 8 vector data graphics</title>
<!--
  Editorial vector data graphics on paper white. Every composition is rendered
  in its finished state; the reveal is done in ffmpeg with a wipe, so no
  intermediate figure is ever printed. The bar carries no scale ticks, because
  any tick value would be a figure the narration never states.
-->
<style>
  @font-face { font-family: fpublic;  src: url('../../../../work-ep02/fonts/publicsans.ttf'); }
  @font-face { font-family: fpublicb; src: url('../../../../work-ep02/fonts/publicsans-bold.ttf'); }
  @font-face { font-family: fmono;    src: url('../../../../work-ep02/fonts/plexmono.ttf'); }
  @font-face { font-family: fanton;   src: url('../../../../work-ep02/fonts/anton.ttf'); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #F7F5F0;
         font-family: fpublic, sans-serif; color: #14161A; }
  #stage { position: absolute; inset: 0; }

  .kicker { font-family: fmono; font-size: 12px; letter-spacing: .20em;
            text-transform: uppercase; color: #6B6F76; }
  .rule { background: #14161A; height: 1px; }
  .hair { background: #C9C6BE; height: 1px; }

  /* bar scene */
  #bar { position: absolute; left: 150px; bottom: 132px; width: 176px; background: #14161A; }
  #barcap { position: absolute; left: 150px; width: 176px; }
  .note { font-size: 13.5px; color: #4A4E55; line-height: 1.45; }

  /* dot grid */
  #grid { position: absolute; display: grid; gap: 13px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #D5D2CA; }
  .dot.on { background: #14161A; }
  .dot.acc { background: #3AAE5C; }
</style>
<body>
<div id="stage"></div>
<script>
  var p = new URLSearchParams(location.search);
  var g = function (k, d) { var v = p.get(k); return v === null ? d : v; };
  var st = document.getElementById('stage');
  var scene = g('scene', 'bar');

  function el(tag, css, html) {
    var e = document.createElement(tag);
    e.style.cssText = css;
    if (html !== undefined) e.innerHTML = html;
    st.appendChild(e);
    return e;
  }

  if (scene === 'bar') {
    el('div', 'position:absolute;left:150px;top:74px', '<span class="kicker">Held by the states</span>');
    el('div', 'position:absolute;left:150px;top:100px;width:980px', '').className = 'rule';
    // the bar itself: full height here, revealed by an ffmpeg wipe
    var h = parseFloat(g('h', '384'));
    var b = document.createElement('div');
    b.id = 'bar'; b.style.height = h + 'px';
    st.appendChild(b);
    // caption sits beside the bar, never inside it
    el('div', 'position:absolute;left:372px;bottom:' + (132 + h - 96) + 'px;width:420px',
       '<div class="kicker" style="margin-bottom:9px">Total on file</div>' +
       '<div class="note">Reported to state administrators by banks, insurers and employers' +
       ' after a dormancy period, and held in the owner&rsquo;s name.</div>');
    el('div', 'position:absolute;left:150px;bottom:118px;width:980px', '').className = 'hair';
    el('div', 'position:absolute;left:150px;bottom:88px',
       '<span class="kicker">Waiting to be claimed</span>');
  }

  if (scene === 'grid') {
    el('div', 'position:absolute;left:150px;top:74px', '<span class="kicker">Americans with property on file</span>');
    el('div', 'position:absolute;left:150px;top:100px;width:980px', '').className = 'rule';
    var cols = 14, rows = 7, n = cols * rows;
    var acc = g('acc', '1') === '1';
    var gd = document.createElement('div');
    gd.id = 'grid';
    gd.style.left = '150px'; gd.style.top = '176px';
    gd.style.gridTemplateColumns = 'repeat(' + cols + ', 20px)';
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      // every seventh dot is marked: one in seven, laid out so the ratio is countable
      d.className = 'dot' + (i % 7 === 3 ? (acc ? ' acc' : ' on') : '');
      gd.appendChild(d);
    }
    st.appendChild(gd);
    el('div', 'position:absolute;left:150px;bottom:96px;width:620px',
       '<div class="note">Every marked dot is one person with property reported in their name.</div>');
  }

  if (scene === 'plain') {
    el('div', 'position:absolute;left:150px;top:74px', '<span class="kicker">' + g('k', '') + '</span>');
    el('div', 'position:absolute;left:150px;top:100px;width:980px', '').className = 'rule';
  }
</script>
